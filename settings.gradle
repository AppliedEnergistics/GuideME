import org.gradle.api.initialization.resolve.RepositoriesMode
import org.gradle.api.initialization.resolve.RulesMode

pluginManagement {
    plugins {
        id 'com.gradleup.shadow' version '9.3.0'
        // https://projects.neoforged.net/neoforged/ModDevGradle
        id 'net.neoforged.moddev' version '2.0.148'
        id 'net.neoforged.moddev.repositories' version '2.0.148'
    }
}

plugins {
    id 'net.neoforged.moddev.repositories'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    rulesMode = RulesMode.FAIL_ON_PROJECT_RULES
    repositories {
        mavenCentral()
        // Snapshots of Applied Energistics 2 to test the website generator with (see renderAe2Site)
        maven {
            name = 'Maven Central Snapshots'
            url = 'https://central.sonatype.com/repository/maven-snapshots/'
            mavenContent {
                snapshotsOnly()
                includeModule 'org.appliedenergistics', 'appliedenergistics2'
            }
        }
        // Guide exports of Applied Energistics 2, which are attached to a release of the guide repository
        ivy {
            name = 'Applied Energistics 2 Guide Data'
            url = 'https://github.com/AppliedEnergistics/guide/releases/download/'
            patternLayout {
                artifact '[revision]/[module].[ext]'
            }
            metadataSources {
                artifact()
            }
            content {
                includeGroup 'org.appliedenergistics.guide'
            }
        }
    }
}

rootProject.name = 'guideme'
include 'markdown'
