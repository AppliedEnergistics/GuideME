import org.gradle.api.initialization.resolve.RepositoriesMode
import org.gradle.api.initialization.resolve.RulesMode

pluginManagement {
    plugins {
        id 'com.gradleup.shadow' version '9.3.0'
        // https://projects.neoforged.net/neoforged/ModDevGradle
        id 'net.neoforged.moddev' version '2.0.145-pr-298-universal-jar'
        id 'net.neoforged.moddev.repositories' version '2.0.145-pr-298-universal-jar'
    }
    repositories {
        gradlePluginPortal()
        maven {
            name = "Maven for PR #298" // https://github.com/neoforged/ModDevGradle/pull/298
            url = uri("https://prmaven.neoforged.net/ModDevGradle/pr298")
            content {
                includeModule("net.neoforged.moddev.legacyforge", "net.neoforged.moddev.legacyforge.gradle.plugin")
                includeModule("net.neoforged.moddev.legacyforge.repositories", "net.neoforged.moddev.legacyforge.repositories.gradle.plugin")
                includeModule("net.neoforged.moddev", "net.neoforged.moddev.gradle.plugin")
                includeModule("net.neoforged.moddev.repositories", "net.neoforged.moddev.repositories.gradle.plugin")
                includeModule("net.neoforged", "moddev-gradle")
            }
        }
    }
}

plugins {
    id 'net.neoforged.moddev.repositories'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    rulesMode = RulesMode.FAIL_ON_PROJECT_RULES
    repositories {
        maven {
            name = "Maven for PR #2879" // https://github.com/neoforged/NeoForge/pull/2879
            url = uri("https://prmaven.neoforged.net/NeoForge/pr2879")
            content {
                includeModule("net.neoforged", "neoforge")
                includeModule("net.neoforged", "testframework")
            }
        }
        mavenCentral()
    }
}

rootProject.name = 'guideme'
include 'markdown'
