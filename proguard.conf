-dontnote
-dontwarn

-dontobfuscate
-dontoptimize

# Needed by lucene and only indirectly referenced
-keep class guideme.internal.shaded.lucene.codecs.lucene103.Lucene103Codec
# Annoyingly, lucene discovers all attributes via reflectively adding Impl suffix
-keep class guideme.internal.shaded.lucene.**.*AttributeImpl { *; }

# Force keep enum members (for values())
-keepclassmembers class * extends java.lang.Enum {
    <fields>;
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# The web export uses some tricky reflection, and keep its package-private classes, which aren't covered by the
# generated rules for public classes
-keep class guideme.internal.web.* {
    *;
}

# Don't touch mixins
-keepclassmembers class guideme.internal.hooks.mixins.* {
    *;
}

# Ensure all JNI classes for DirectoryWatcher are kept to ensure hot reload works on MacOS
-keep class guideme.internal.shaded.methvin.watchservice.jna.* {
    *;
}