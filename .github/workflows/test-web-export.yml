name: 'Test Web Export'

on:
  push:
    # Only on branches, not tags/releases
    branches:
      - '**'
  pull_request:
    branches:
      - '*'

# Cancel outdated builds for the same branch
concurrency:
  group: test-web-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only run the pull-request build if the pull-request was opened from another repository,
    # since we already run this workflow for the branch push to our repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - run: git fetch origin --tags
        shell: bash
      - uses: ./.github/actions/gradle-setup

      - name: Generate Static HTML Site
        # SDL needs a 24-bit screen to find a GLX visual for the OpenGL context (xvfb-run defaults to 8-bit).
        # If the game can't create a renderer, it hangs on an error dialog, so limit how long this can take.
        timeout-minutes: 10
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./gradlew printProjectVersion createStaticSite --max-workers 1

      - name: Upload Generated Site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/website/
