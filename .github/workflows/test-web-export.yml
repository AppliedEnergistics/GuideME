name: 'Test Web Export'

on:
  push:
    # Only on branches, not tags/releases
    branches:
      - '**'
  pull_request:
    branches:
      - '*'

# Cancel outdated builds for the same branch
concurrency:
  group: test-web-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only run the pull-request build if the pull-request was opened from another repository,
    # since we already run this workflow for the branch push to our repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - run: git fetch origin --tags
        shell: bash
      - uses: ./.github/actions/gradle-setup

      # Xvfb offers no sRGB-capable GLX visual, which the OpenGL backend requires. The game then falls back to Vulkan,
      # for which we install Mesa's software implementation (lavapipe).
      - name: Install software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-utils

      - name: glxinfo 1
        run: xvfb-run -a -s "-screen 0 1280x1024x24" glxinfo

      - name: glxinfo 2
        run: xvfb-run -a -s "-screen 0 1280x1024x24+32" glxinfo
