name: 'Label PR by target version'

# pull_request_target runs in the context of the base repository, so it has write access
# even for PRs from forks. This is safe here because we never check out or run PR code.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
  # Manually (re-)label all open PRs
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABEL_PREFIX = 'MC ';
            const LABEL_COLOR = '1d76db';
            const VERSION_BRANCH = /^\d+\.\d+(\.\d+)?$/;

            const { owner, repo } = context.repo;
            const versionCache = new Map();
            const knownLabels = new Set();

            async function getVersion(pr) {
              const base = pr.base.ref;
              if (VERSION_BRANCH.test(base)) {
                return base;
              }
              if (base !== pr.base.repo.default_branch) {
                return null;
              }
              if (versionCache.has(base)) {
                return versionCache.get(base);
              }
              // The default branch tracks the newest Minecraft version; read it from gradle.properties.
              let version = null;
              try {
                const { data } = await github.rest.repos.getContent({
                  owner, repo, path: 'gradle.properties', ref: base,
                });
                const props = Buffer.from(data.content, 'base64').toString('utf8');
                const match = props.match(/^minecraft_version\s*=\s*(\S+)\s*$/m);
                if (match) {
                  // 26.3.0 -> 26.3, to match how version branches are named
                  version = match[1].replace(/\.0$/, '');
                }
              } catch (e) {
                core.warning(`Could not read minecraft_version from ${base}: ${e.message}`);
              }
              versionCache.set(base, version);
              return version;
            }

            async function ensureLabel(name, version) {
              if (knownLabels.has(name)) {
                return;
              }
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status !== 404) throw e;
                core.info(`Creating label ${name}`);
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name, color: LABEL_COLOR,
                    description: `Targets Minecraft ${version}`,
                  });
                } catch (e2) {
                  // Another run may have created it concurrently
                  if (e2.status !== 422) throw e2;
                }
              }
              knownLabels.add(name);
            }

            async function labelPr(pr) {
              const version = await getVersion(pr);
              const wanted = version ? LABEL_PREFIX + version : null;
              const current = pr.labels.map(l => l.name);

              // Drop labels for other versions (e.g. when the base branch was changed)
              for (const name of current) {
                if (name.startsWith(LABEL_PREFIX) && name !== wanted) {
                  core.info(`#${pr.number}: removing stale label ${name}`);
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name });
                }
              }

              if (!wanted) {
                core.info(`#${pr.number}: base branch ${pr.base.ref} is not a version branch; nothing to label.`);
                return;
              }
              if (current.includes(wanted)) {
                return;
              }

              await ensureLabel(wanted, version);
              core.info(`#${pr.number}: adding label ${wanted}`);
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [wanted] });
            }

            if (context.eventName === 'workflow_dispatch') {
              const prs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100,
              });
              core.info(`Labeling ${prs.length} open PRs`);
              for (const pr of prs) {
                await labelPr(pr);
              }
            } else {
              await labelPr(context.payload.pull_request);
            }
